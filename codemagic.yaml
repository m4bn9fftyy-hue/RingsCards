workflows:
  ios-build:
    name: Build Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods Dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Build and Package IPA
        script: |
          set -e
          xcodebuild build \
            -workspace "RingsCards.xcworkspace" \
            -scheme "RingsCards" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR="$CM_BUILD_DIR/build"

          cd "$CM_BUILD_DIR/build/Release-iphoneos"
          mkdir -p Payload
          cp -r "RingsCards.app" Payload/
          zip -qr "$CM_BUILD_DIR/RingsCards.ipa" Payload
    artifacts:
      - "*.ipa"
